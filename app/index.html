 function bind(){baseBind();root.querySelectorAll('[data-cite]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();if(b.dataset.cite)openModal('cite',b.dataset.cite);});root.querySelectorAll('[data-regenerate-plan]').forEach(b=>b.onclick=()=>buildPlan(true));if($('ai-event-toggle'))$('ai-event-toggle').onchange=e=>{const a=account(),before=scoreOf(a),bp=priority(a);ENG.setSource(e.target.dataset.source,e.target.checked);const after=scoreOf(a),p=plans[a.id];if(p&&!p.approved){p.revision=(p.revision||0)+1;}if(p&&p.approved){p.approved=false;p.revision=(p.revision||0)+1;revokePlanTasks(a.id);}const msg='Dated event '+(e.target.checked?'included':'excluded')+'. Score '+(before?before.total.toFixed(1):'—')+' → '+(after?after.total.toFixed(1):'—')+', '+bp+' → '+priority(a)+'.';(activities[a.id]||(activities[a.id]=[])).unshift(msg+(p?' The plan needs a fresh draft.':''));persist();render(true);note(msg+(p?' Plan needs a fresh draft.':''));};root.querySelectorAll('[data-brief-kind]').forEach(b=>b.onclick=()=>{briefKind=b.dataset.briefKind;openModal('brief');});root.querySelectorAll('[data-open-brief]').forEach(b=>b.onclick=()=>{savedBrief=briefs[b.dataset.openBrief];openModal('saved-brief');});root.querySelectorAll('[data-use-person],[data-select-person]').forEach(b=>b.onclick=()=>{const a=account(),id=b.dataset.usePerson||b.dataset.selectPerson,person=a.people.find(x=>x.id===id);if(!person)return;let p=plans[a.id];if(!p){const c=campaigns[a.id];p=plans[a.id]={person:id,role:c.role,angle:person.angle,hypothesis:c.pain,action:recommendedAction(a),subject:c.subject,revision:0};}p.person=id;p.angle=person.angle;p.contactChanged=!!p.messageEdited;if(!p.actionEdited)p.action=person.action;if(!p.messageEdited)p.message=outreach(a,p);markDraft(p);(activities[a.id]||(activities[a.id]=[])).unshift('Entry contact changed to '+person.name+'. Review the approach before use.');modal=null;returnState=null;route='plan';persist();render();});[['ai-plan-action','action'],['ai-hypothesis','hypothesis'],['ai-message-subject','subject'],['ai-message','message'],['ai-followup','followup']].forEach(([id,key])=>{const input=$(id);if(input)input.oninput=()=>{const p=plans[selected];p[key]=input.value;if(key==='message'||key==='subject')p.messageEdited=true;if(key==='message')p.contactChanged=false;if(key==='action')p.actionEdited=true;if(key==='hypothesis')p.hypothesisEdited=true;markDraft(p);};});if($('ai-entry-role'))$('ai-entry-role').onchange=e=>{const p=plans[selected];p.role=e.target.value;p.angle='Validate '+p.role+' ownership of '+campaigns[selected].theme.toLowerCase()+'.';markDraft(p);render();};if($('ai-refresh-message'))$('ai-refresh-message').onclick=()=>{const p=plans[selected];if(p.messageEdited&&p.message.trim()){note('Your draft is preserved. Clear the draft first to rebuild it.');return;}p.message=outreach(account(),p);p.messageEdited=false;p.contactChanged=false;markDraft(p);render();};if($('ai-copy-message'))$('ai-copy-message').onclick=async()=>{const p=plans[selected],text='Subject: '+p.subject+'\n\n'+p.message;try{await navigator.clipboard.writeText(text);note('Draft copied.');}catch(e){$('ai-message').select();note('Message body selected. Copy it with your keyboard; copy the subject separately.');}};if($('ai-save-qualification'))$('ai-save-qualification').onclick=()=>{const q={updatedDate:asOfDate};for(const k of ['source','date','owner','problem','impact','next']){const input=$('ai-q-'+k);if(!input.checkValidity()){input.reportValidity();return;}q[k]=input.value.trim();}qualification[selected]=q;(activities[selected]||(activities[selected]=[])).unshift('Qualification saved: '+qualState(account())+'.');persist();render();note((storageAvailable?'Qualification saved. ':'Qualification kept for this session. Browser storage is unavailable. ')+qualState(account())+'.');};if($('ai-save-health'))$('ai-save-health').onclick=()=>{const h={};for(const k of Object.keys(health[selected])){const input=$('ai-health-'+k);if(!input.checkValidity()){input.reportValidity();return;}h[k]=input.value===''?null:Number(input.value);}health[selected]=h;if(plans[selected]){plans[selected].approved=false;plans[selected].revision=(plans[selected].revision||0)+1;revokePlanTasks(selected);}persist();modal=null;returnState=null;route='record';tab='overview';render();note('Customer signals updated. Review the approach again.');};if($('ai-cs-review'))$('ai-cs-review').onclick=()=>{const id=selected+'-cs';if(!tasks.some(t=>t.id===id))tasks.push({id,account:selected,text:'Retention play: AE, CSM and implementation review usage, agree the retention plan and set a checkpoint date.',owner:'Account team (AE, CSM, implementation)',due:null,done:false});persist();note('Retention play added to My tasks. No message was sent.');render();};if($('ai-brief-date'))$('ai-brief-date').onchange=e=>dailyDate=e.target.value;if($('ai-save-brief'))$('ai-save-brief').onclick=()=>{savedBrief=JSON.parse(JSON.stringify(briefDraft));briefs[savedBrief.kind]=savedBrief;unread=true;modal=null;returnState=null;route='briefs';persist();render();note((savedBrief.kind==='daily'?'Daily':'Weekly')+' brief '+(storageAvailable?'saved.':'kept for this session. Browser storage is unavailable.'));};root.querySelectorAll('[data-task]').forEach(b=>b.onchange=()=>{tasks.find(t=>t.id===b.dataset.task).done=b.checked;persist();render();});}

 ];

 let tour=null,tourWait=null;
 const goTo=(r,acct)=>{++epoch;modal=null;returnState=null;if(acct){selected=acct;tab='overview';}route=r;render();};
 const TOUR=[
  {go:()=>goTo('focus'),el:'.ai-focuslist',t:'Your book, ranked',b:'Each week the workspace ranks your accounts from public research: fund news, firm team pages and researched contacts. P1 means a dated trigger gives you a reason to call now. P2 means build the case first.'},
  {go:()=>goTo('focus'),el:'.ai-ledger',t:'Estimated time back',b:'An estimate of the prep time this saves in a typical week. Open it to see the breakdown, job by job.'},
  {go:()=>goTo('record','advent'),el:'.ai-scorecard',t:'Why Advent is on top',b:'Four drivers make the score: fund lifecycle timing, ICP fit, buyer access and signal strength. Turn a source off under Change inputs and the score moves in front of you.'},
  {go:()=>goTo('record','advent'),el:'.ai-approachgrid',t:'The angle, from the research',b:'Why this account, why now, what we know and the pain to confirm. Open Sources for the public facts behind them. The pain stays a hypothesis until a buyer confirms it.'},
  {go:()=>goTo('record','advent'),el:'[data-build-plan]',t:'Watch AI draft the campaign',b:'AI reads only Advent’s active sources and writes the goals, pain to confirm, who to talk to, the angle and the next move. You watch it write. Then code checks every line: claims must cite a source, and anything it can’t support stays unknown.',run:true},
  {go:()=>plans.advent?goTo('plan','advent'):goTo('record','advent'),el:'.ai-runsummary,.ai-document,.ai-scorecard',t:'You review, then approve',b:'See what AI wrote and which sources it used. Edit the pain hypothesis and the message. Approving turns the next move into tasks you can date. Nothing is sent to the buyer or the CRM.'},
  {go:()=>goTo('focus'),el:'.ai-customers',t:'Customer priorities',b:'Customers sit in their own lane. Usage down or an open issue: run a retention play with the CSM. Usage up and a real new need: that is an expansion opportunity.'},
  {go:()=>goTo('focus'),el:'[data-catchup]',t:'Catch me up',b:'Back from leave, or a new account list? Pick how long you were out and see every dated event, new contact and usage change in that window, plus your open drafts and overdue tasks.'},
  {go:()=>{goTo('record','advent');tab='meeting';render();},el:'.ai-meeting,.ai-precall',t:'From reply to discovery meeting',b:'Outreach starts with no prior contact. When a buyer replies, record it here; the stage changes only then. Confirm a meeting and you get an internal pre-call plan: agenda to share, hypotheses to test, questions, and notes you fill in after the call.'},
  {go:()=>goTo('focus'),el:'[data-brief-kind="weekly"]',t:'Your weekly brief',b:'Your plan for the week on one page: five accounts, the people and titles to work at each, and this week’s move. Approved moves carry through; the rest are marked Suggested.'}
 ];
 function tourMark(scroll){root.querySelectorAll('.ai-tourtarget').forEach(e=>e.classList.remove('ai-tourtarget'));if(!tour||tourWait)return;const el=TOUR[tour.i].el.split(',').map(s=>root.querySelector('#ai-stage '+s)).find(Boolean);if(el){el.classList.add('ai-tourtarget');if(scroll)el.scrollIntoView({block:'center',behavior:window.matchMedia?.('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});}}
 function tourCard(){let card=$('ai-tour');if(!tour){card?.remove();tourMark(false);return;}if(!card){card=document.createElement('div');card.id='ai-tour';card.className='ai-tour';card.setAttribute('role','dialog');card.setAttribute('aria-label','Product tour');root.appendChild(card);}const s=TOUR[tour.i],last=tour.i===TOUR.length-1;if(tourWait){card.classList.add('waiting');card.innerHTML='<div class="ai-tourhead"><span>'+icon('sparkles')+'Watching AI draft</span><button class="ai-textbutton" data-tour-end type="button">End tour</button></div><p>The tour continues when the draft is ready.</p>';}else{card.classList.remove('waiting');card.innerHTML='<div class="ai-tourhead"><span>Tour · '+(tour.i+1)+' of '+TOUR.length+'</span><button class="ai-iconbutton" data-tour-end type="button" aria-label="End tour">'+icon('x')+'</button></div><h2>'+esc(s.t)+'</h2><p>'+esc(s.b)+'</p><div class="ai-tourbar"><button class="ai-textbutton" data-tour-back type="button" '+(tour.i?'':'disabled')+'>Back</button>'+(s.run?'<button class="ai-button secondary" data-tour-next type="button">Skip</button><button class="ai-button" data-tour-run type="button">'+icon('sparkles')+(plans.advent?'Redraft it live':'Draft it live')+'</button>':'<button class="ai-button" data-tour-next type="button">'+(last?'Finish':'Next')+'</button>')+'</div>';}card.querySelector('[data-tour-end]').onclick=()=>tourEnd();const back=card.querySelector('[data-tour-back]'),next=card.querySelector('[data-tour-next]'),run=card.querySelector('[data-tour-run]');if(back)back.onclick=()=>tourShow(tour.i-1);if(next)next.onclick=()=>last?tourEnd():tourShow(tour.i+1);if(run)run.onclick=()=>{const at=tour.i;goTo('record','advent');tourWait=setInterval(()=>{if(!tour){clearInterval(tourWait);tourWait=null;return;}if(route==='plan'){clearInterval(tourWait);tourWait=null;tourShow(at+1);}},300);tourCard();buildPlan(!!plans.advent);};icons();}
 function tourShow(i){if(i<0||i>=TOUR.length)return;tour={i};TOUR[i].go();tourCard();requestAnimationFrame(()=>tourMark(true));}
 function tourEnd(){clearInterval(tourWait);tourWait=null;tour=null;tourCard();}
 const renderBase=render;render=function(){const out=renderBase.apply(this,arguments);if(tour){tourMark(false);}root.querySelectorAll('[data-tour-start]').forEach(b=>b.onclick=()=>{modal=null;returnState=null;tourShow(0);});return out;};
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&tour&&!modal)tourEnd();});
 function sellerGuide(){return shell('Seller Q&A','<div class="ai-modalbody ai-faq">'+sellerAnswers.map((x,i)=>'<details '+(i===0?'open':'')+'><summary>'+esc(x[0])+'</summary><p>'+esc(x[1])+'</p></details>').join('')+'</div>','<button class="ai-button secondary" data-tour-start type="button">'+icon('compass')+'Take the product tour</button><button class="ai-button" data-close-modal type="button">Back to work</button>');}
 function researchView(){const a=account(),c=campaigns[a.id],link=firmSources[a.id];return shell('Account sources','<div class="ai-modalbody"><h2>'+esc(a.name)+'</h2><div class="ai-researchblock"><h3>Firm context</h3><p>'+esc(a.strategy)+'. '+(link?'<a href="'+esc(link)+'" target="_blank" rel="noreferrer">Official firm source ↗</a>':'Current customer.')+'</p></div><div class="ai-researchblock"><h3>Why now</h3><p>'+esc(trigNow(a,'No dated trigger yet. Ask what would make a change timely.'))+'</p></div>'+eventToggle(a)+'<div class="ai-researchblock"><h3>What to test in discovery</h3><p>'+esc(c.pain)+' This is a working hypothesis, not a confirmed account problem.</p></div><div class="ai-researchblock"><h3>Who to start with</h3><p>'+esc(target(a))+'. Confirm who actually owns the process before personalizing the plan.</p></div><div class="ai-researchblock"><h3>Why this product could fit</h3><p>'+esc(c.fit)+'</p></div><p class="ai-tiny">Public facts checked '+checkedDay(a)+'. Outreach questions do not establish need, budget or intent.</p></div>','<span>Research supports a conversation</span><button class="ai-button" data-build-plan type="button">Open campaign</button>');}

 render();
 const replayChip=()=>{const chip=$('ai-modelchip');if(chip)chip.hidden=true;};fetch('/api/status',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{if(!j){replayChip();return;}api={configured:j.configured===true,model:typeof j.model==='string'?j.model:'',checked:true};const chip=$('ai-modelchip');if(chip){chip.hidden=!api.configured;chip.className='ai-modelchip on';chip.textContent='Live AI · '+api.model;}}).catch(replayChip);
})();
